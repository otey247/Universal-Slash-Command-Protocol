# USCP Security Baseline
# Minimum security controls enforced for all commands that analyze or generate code.

version: "1.0.0"

owasp_top10:
  # Every review command must check for all OWASP Top 10 categories.
  enforce: true
  categories:
    - "A01:2021 Broken Access Control"
    - "A02:2021 Cryptographic Failures"
    - "A03:2021 Injection"
    - "A04:2021 Insecure Design"
    - "A05:2021 Security Misconfiguration"
    - "A06:2021 Vulnerable and Outdated Components"
    - "A07:2021 Identification and Authentication Failures"
    - "A08:2021 Software and Data Integrity Failures"
    - "A09:2021 Security Logging and Monitoring Failures"
    - "A10:2021 Server-Side Request Forgery"

secrets_detection:
  # Flag any hardcoded secrets, tokens, or credentials found in reviewed files.
  enforce: true
  patterns:
    - "API key"
    - "secret"
    - "password"
    - "token"
    - "private_key"

dependency_policy:
  # Flag dependencies with known CVEs (CVSS >= 7.0) as critical findings.
  cvss_critical_threshold: 7.0
  enforce: true

data_handling:
  pii_detection: required
  encryption_at_rest: recommended
  encryption_in_transit: required
  data_retention_policy: recommended
